name: Verify frozen research
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: 05_analysis/requirements-analysis.txt
      - run: python -m pip install -r 05_analysis/requirements-analysis.txt
      - run: python tools/verify_release.py
